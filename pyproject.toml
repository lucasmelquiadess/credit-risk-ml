[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-ml"
version = "0.1.0"
description = "End-to-end machine learning pipeline for credit risk prediction."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lucas" }]

[project.scripts]
credit-risk-make-dataset = "src.data.make_dataset:main"
credit-risk-train = "src.models.train_model:main"
credit-risk-predict = "src.models.predict_model:main"

[tool.setuptools]
packages = [
    "src",
    "src.data",
    "src.features",
    "src.models",
    "src.utils",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
